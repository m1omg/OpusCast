name: Android

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
    # a version tag (v1.0, v1.1, ...) builds the app and publishes a GitHub release with the APK;
    # the release notes are the tag's message (git tag -a v1.1 -m "...")
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  # or publish a release on GitHub (Releases → Draft a new release): the APK is built and attached
  release:
    types: [published]
  workflow_dispatch:
  # the Release workflow (release.yml) builds the app through this one
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the core (DLNA, file server, subtitles)
        run: ./gradlew -p core test

      # Optional: sign with your own key so updates install over each other. Add the repository secrets
      # OPUSCAST_KEYSTORE_B64 (base64 of a .jks), OPUSCAST_KEYSTORE_PASSWORD, OPUSCAST_KEY_ALIAS and
      # OPUSCAST_KEY_PASSWORD. Without them the APK is signed with the runner's throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.OPUSCAST_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OPUSCAST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the app
        env:
          OPUSCAST_KEYSTORE_PASSWORD: ${{ secrets.OPUSCAST_KEYSTORE_PASSWORD }}
          OPUSCAST_KEY_ALIAS: ${{ secrets.OPUSCAST_KEY_ALIAS }}
          OPUSCAST_KEY_PASSWORD: ${{ secrets.OPUSCAST_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease

      - name: Lint findings
        if: always()
        run: cat app/build/reports/lint-results-release.txt 2>/dev/null || echo "no lint report"

      - uses: actions/upload-artifact@v4
        with:
          name: OpusCast-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/core/build/reports/
            android/app/build/reports/
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the tag (its message is the release notes)
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/download-artifact@v4
        with:
          name: OpusCast-android
          path: apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="OpusCast-$GITHUB_REF_NAME.apk"
          cp apk/*.apk "$apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber   # made on GitHub: add the APK
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "OpusCast ${GITHUB_REF_NAME#v}" --notes-from-tag --verify-tag
          fi
