name: Release

# Actions → Release → Run workflow, with a new version tag (v1.0, v1.1, ...): builds everything and
# publishes a GitHub release under that tag, made on the commit the workflow runs on. The release notes
# come from .github/releases/<tag>.md - write that file first.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, e.g. v1.0"
        required: true

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  desktop:
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency: release-${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag and the notes
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::the tag should look like v1.1"; exit 1;; esac
          test -f ".github/releases/$TAG.md" || { echo "::error::write .github/releases/$TAG.md first"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then echo "::error::$TAG is released already"; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          name: OpusCast-android
          path: apk

      - uses: actions/download-artifact@v4
        with:
          pattern: OpusCast-{windows,macos}
          path: desktop
          merge-multiple: true

      - name: Publish the release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/*.apk "OpusCast-$TAG.apk"
          cp desktop/OpusCast-Setup.exe "OpusCast-$TAG-Windows-Setup.exe"
          cp desktop/OpusCast-windows-x64.zip "OpusCast-$TAG-Windows.zip"
          cp desktop/OpusCast-macOS.dmg "OpusCast-$TAG-macOS.dmg"
          gh release create "$TAG" "OpusCast-$TAG.apk" "OpusCast-$TAG-Windows-Setup.exe" "OpusCast-$TAG-Windows.zip" \
            "OpusCast-$TAG-macOS.dmg" --target "$GITHUB_SHA" --title "OpusCast ${TAG#v}" \
            --notes-file ".github/releases/$TAG.md"
